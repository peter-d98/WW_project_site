<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tank Node Equation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #edf6ef;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    #eq {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      overflow-x: auto;
      text-align: center;
    }

    /* Make KaTeX render white on dark background */
    .katex { color: #edf6ef; }
  </style>
</head>
<body>
  <div id="eq"></div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      katex.render(
        "C_i \\frac{dT_i}{dt} = -UA_{\\text{loss},i}\\,(T_i - T_{\\text{amb}}) + UA_{\\text{adj},i-1}\\,(T_{i-1} - T_i) + UA_{\\text{adj},i}\\,(T_{i+1} - T_i)",
        document.getElementById("eq"),
        { displayMode: true, throwOnError: false }
      );
    });
  </script>
</body>
</html>
